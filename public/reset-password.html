<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — EimemesChat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f5f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      text-align: center;
    }
    img.logo { width: 48px; height: 48px; margin-bottom: 16px; }
    h1 { font-size: 20px; color: #1e293b; margin-bottom: 8px; }
    p { font-size: 14px; color: #64748b; margin-bottom: 20px; line-height: 1.5; }

    .input-wrap {
      position: relative;
      margin-bottom: 12px;
    }
    .input-wrap input {
      width: 100%; padding: 14px 44px 14px 16px;  /* extra right padding for the eye icon */
      border-radius: 10px; border: 1px solid #cbd5e1;
      font-size: 15px; outline: none; font-family: inherit;
    }
    .input-wrap input:focus { border-color: #2563eb; }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      color: #94a3b8;
    }
    .toggle-password:hover { color: #64748b; }

    button {
      width: 100%; padding: 14px;
      background: #2563eb; color: #fff;
      border: none; border-radius: 10px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .error { color: #ef4444; font-size: 13px; margin-top: 12px; }
    .success { color: #16a34a; font-size: 14px; }
    .link { color: #2563eb; text-decoration: none; font-size: 14px; }
    .back { margin-top: 16px; display: inline-block; }

    .hidden { display: none; }

    .strength-bar { display: flex; gap: 4px; margin-bottom: 12px; }
    .strength-bar div { flex: 1; height: 3px; border-radius: 999px; background: #e2e8f0; }
    .strength-bar div.active.weak { background: #ef4444; }
    .strength-bar div.active.fair { background: #f59e0b; }
    .strength-bar div.active.good { background: #eab308; }
    .strength-bar div.active.strong { background: #22c55e; }
    .strength-label { font-size: 12px; margin-bottom: 12px; text-align: left; padding-left: 4px; color: #64748b; }

    .mismatch { color: #ef4444; font-size: 12px; margin-top: -8px; margin-bottom: 12px; text-align: left; padding-left: 4px; }
  </style>
</head>
<body>

  <div class="card">
    <img class="logo" src="/chat-logo.png" alt="EimemesChat">

    <!-- Normal reset form -->
    <div id="form-section">
      <h1>Reset your password</h1>
      <p id="email-display"></p>

      <!-- New password -->
      <div class="input-wrap">
        <input type="password" id="password" placeholder="New password" autocomplete="new-password">
        <button type="button" class="toggle-password" data-target="password" aria-label="Show password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <div class="strength-bar" id="strength-bar">
        <div></div><div></div><div></div><div></div>
      </div>
      <div class="strength-label" id="strength-label"></div>

      <!-- Confirm password -->
      <div class="input-wrap">
        <input type="password" id="confirm" placeholder="Confirm new password" autocomplete="new-password">
        <button type="button" class="toggle-password" data-target="confirm" aria-label="Show password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div class="mismatch" id="mismatch-msg"></div>

      <button id="submit-btn" disabled>Reset Password</button>
      <div class="error" id="error"></div>
    </div>

    <!-- Success message -->
    <div id="success-section" class="hidden">
      <p class="success" style="font-size:18px; font-weight:600;">Password reset successfully.</p>
      <p>You can now sign in with your new password.</p>
      <a class="link back" href="/">Back to Sign In</a>
    </div>

    <!-- Invalid link message -->
    <div id="invalid-section" class="hidden">
      <h1>Link no longer valid</h1>
      <p>This password reset link has expired or has already been used.</p>
      <p>Please request a new one from the sign‑in screen.</p>
      <a class="link back" href="/">Go to Sign In</a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const uid = urlParams.get('uid');
    const emailParam = urlParams.get('email');

    const formSection = document.getElementById('form-section');
    const successSection = document.getElementById('success-section');
    const invalidSection = document.getElementById('invalid-section');
    const emailDisplay = document.getElementById('email-display');

    if (!token || !uid) {
      formSection.classList.add('hidden');
      invalidSection.classList.remove('hidden');
    } else {
      if (emailParam) {
        emailDisplay.textContent = 'For ' + decodeURIComponent(emailParam);
      }

      const passwordInput = document.getElementById('password');
      const confirmInput = document.getElementById('confirm');
      const submitBtn = document.getElementById('submit-btn');
      const errorDiv = document.getElementById('error');
      const mismatchMsg = document.getElementById('mismatch-msg');
      const strengthBar = document.getElementById('strength-bar').children;
      const strengthLabel = document.getElementById('strength-label');

      // Show/hide password toggles
      document.querySelectorAll('.toggle-password').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetId = btn.getAttribute('data-target');
          const input = document.getElementById(targetId);
          if (!input) return;
          const isPassword = input.type === 'password';
          input.type = isPassword ? 'text' : 'password';
          btn.innerHTML = isPassword
            ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                 <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                 <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                 <path d="m14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                 <line x1="1" y1="1" x2="23" y2="23"/>
               </svg>`
            : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                 <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                 <circle cx="12" cy="12" r="3"/>
               </svg>`;
        });
      });

      function getStrength(pw) {
        let score = 0;
        if (pw.length >= 8) score++;
        if (/[A-Z]/.test(pw)) score++;
        if (/[0-9]/.test(pw)) score++;
        if (/[^A-Za-z0-9]/.test(pw)) score++;
        return score;
      }

      function updateButton() {
        const pw = passwordInput.value;
        const cf = confirmInput.value;
        const match = pw === cf;
        const strong = pw.length >= 8;
        submitBtn.disabled = !strong || !match;

        if (cf.length > 0 && !match) {
          mismatchMsg.textContent = 'Passwords do not match';
        } else {
          mismatchMsg.textContent = '';
        }
      }

      passwordInput.addEventListener('input', () => {
        const score = getStrength(passwordInput.value);
        const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
        const colors = ['', 'weak', 'fair', 'good', 'strong'];
        for (let i = 0; i < 4; i++) {
          strengthBar[i].classList.remove('active', 'weak', 'fair', 'good', 'strong');
          if (i < score) {
            strengthBar[i].classList.add('active', colors[score]);
          }
        }
        strengthLabel.textContent = labels[score] || '';
        updateButton();
      });

      confirmInput.addEventListener('input', updateButton);

      // initial button state
      updateButton();

      submitBtn.addEventListener('click', async () => {
        errorDiv.textContent = '';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Resetting…';

        try {
          const res = await fetch('/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uid, token, newPassword: passwordInput.value }),
          });
          const data = await res.json();
          if (res.ok) {
            formSection.classList.add('hidden');
            successSection.classList.remove('hidden');
          } else {
            formSection.classList.add('hidden');
            invalidSection.classList.remove('hidden');
          }
        } catch {
          errorDiv.textContent = 'Something went wrong. Please try again.';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Reset Password';
        }
      });
    }
  </script>

</body>
</html>
