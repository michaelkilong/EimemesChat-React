<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — EimemesChat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f5f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      text-align: center;
    }
    img.logo { width: 48px; height: 48px; margin-bottom: 16px; }
    h1 { font-size: 20px; color: #1e293b; margin-bottom: 8px; }
    p { font-size: 14px; color: #64748b; margin-bottom: 20px; line-height: 1.5; }
    input {
      width: 100%; padding: 14px 16px; margin-bottom: 12px;
      border-radius: 10px; border: 1px solid #cbd5e1;
      font-size: 15px; outline: none; font-family: inherit;
    }
    input:focus { border-color: #2563eb; }
    button {
      width: 100%; padding: 14px;
      background: #2563eb; color: #fff;
      border: none; border-radius: 10px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { color: #ef4444; font-size: 13px; margin-top: 12px; }
    .success { color: #16a34a; font-size: 14px; }
    .link { color: #2563eb; text-decoration: none; font-size: 14px; }
    .back { margin-top: 16px; display: inline-block; }
    .hidden { display: none; }
    .strength-bar { display: flex; gap: 4px; margin-bottom: 12px; }
    .strength-bar div { flex: 1; height: 3px; border-radius: 999px; background: #e2e8f0; }
    .strength-bar div.active.weak { background: #ef4444; }
    .strength-bar div.active.fair { background: #f59e0b; }
    .strength-bar div.active.good { background: #eab308; }
    .strength-bar div.active.strong { background: #22c55e; }
    .strength-label { font-size: 12px; margin-bottom: 12px; text-align: left; padding-left: 4px; color: #64748b; }
    .invalid-icon { font-size: 48px; margin-bottom: 16px; }
  </style>
</head>
<body>

  <div class="card">
    <img class="logo" src="/chat-logo.png" alt="EimemesChat">

    <!-- Normal reset form (hidden when link is invalid) -->
    <div id="form-section">
      <h1>Reset your password</h1>
      <p id="email-display"></p>
      <input type="password" id="password" placeholder="New password" autocomplete="new-password">
      <div class="strength-bar" id="strength-bar">
        <div></div><div></div><div></div><div></div>
      </div>
      <div class="strength-label" id="strength-label"></div>
      <input type="password" id="confirm" placeholder="Confirm new password" autocomplete="new-password">
      <button id="submit-btn" disabled>Reset Password</button>
      <div class="error" id="error"></div>
    </div>

    <!-- Success message (shown after successful reset) -->
    <div id="success-section" class="hidden">
      <p class="success" style="font-size:18px; font-weight:600;">Password reset successfully.</p>
      <p>You can now sign in with your new password.</p>
      <a class="link back" href="/">Back to Sign In</a>
    </div>

    <!-- Invalid link message (shown when token missing, expired, used, etc.) -->
    <div id="invalid-section" class="hidden">
      <div class="invalid-icon">🔗</div>
      <h1>Link no longer valid</h1>
      <p>This password reset link has expired or has already been used.</p>
      <p>Please request a new one from the sign‑in screen.</p>
      <a class="link back" href="/">Go to Sign In</a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const uid = urlParams.get('uid');
    const emailParam = urlParams.get('email');

    const formSection = document.getElementById('form-section');
    const successSection = document.getElementById('success-section');
    const invalidSection = document.getElementById('invalid-section');
    const emailDisplay = document.getElementById('email-display');

    // Immediately hide form if token/uid missing
    if (!token || !uid) {
      formSection.classList.add('hidden');
      invalidSection.classList.remove('hidden');
    } else {
      // Show email if provided
      if (emailParam) {
        emailDisplay.textContent = 'For ' + decodeURIComponent(emailParam);
      }

      // Form elements
      const passwordInput = document.getElementById('password');
      const confirmInput = document.getElementById('confirm');
      const submitBtn = document.getElementById('submit-btn');
      const errorDiv = document.getElementById('error');
      const strengthBar = document.getElementById('strength-bar').children;
      const strengthLabel = document.getElementById('strength-label');

      function getStrength(pw) {
        let score = 0;
        if (pw.length >= 8) score++;
        if (/[A-Z]/.test(pw)) score++;
        if (/[0-9]/.test(pw)) score++;
        if (/[^A-Za-z0-9]/.test(pw)) score++;
        return score;
      }

      passwordInput.addEventListener('input', () => {
        const score = getStrength(passwordInput.value);
        const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];
        const colors = ['', 'weak', 'fair', 'good', 'strong'];
        for (let i = 0; i < 4; i++) {
          strengthBar[i].classList.remove('active', 'weak', 'fair', 'good', 'strong');
          if (i < score) {
            strengthBar[i].classList.add('active', colors[score]);
          }
        }
        strengthLabel.textContent = labels[score] || '';
        updateButton();
      });

      confirmInput.addEventListener('input', updateButton);

      function updateButton() {
        const pw = passwordInput.value;
        const cf = confirmInput.value;
        submitBtn.disabled = pw.length < 8 || pw !== cf;
      }

      submitBtn.addEventListener('click', async () => {
        errorDiv.textContent = '';
        submitBtn.disabled = true;
        submitBtn.textContent = 'Resetting…';

        try {
          const res = await fetch('/api/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ uid, token, newPassword: passwordInput.value }),
          });
          const data = await res.json();
          if (res.ok) {
            formSection.classList.add('hidden');
            successSection.classList.remove('hidden');
          } else {
            // Show a friendly message for any invalid-token scenario
            formSection.classList.add('hidden');
            invalidSection.classList.remove('hidden');
          }
        } catch {
          errorDiv.textContent = 'Something went wrong. Please try again.';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Reset Password';
        }
      });
    }
  </script>

</body>
</html>
